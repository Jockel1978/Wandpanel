<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wandpanel</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10141a">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#10141a;--card:rgba(27,34,44,.85);--on:#f5b942;--tx:#e8edf3;--mut:#8493a5;--minw:170px;--gap:14px;--rad:16px;--fs:1;--dim:0;--blur:0px}
html{font-size:calc(16px*var(--fs))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;user-select:none;min-height:100vh}
#bgimg{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center}
#dim{position:fixed;inset:0;z-index:-1;background:#000;opacity:var(--dim);pointer-events:none}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;text-shadow:0 1px 6px #0008}
#clock{font-size:2.2rem;font-weight:300}
#date{color:var(--mut);font-size:.95rem}
.btns button{background:var(--card);color:var(--tx);border:0;border-radius:10px;padding:10px 14px;font-size:1rem;margin-left:8px;opacity:.85;backdrop-filter:blur(var(--blur))}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--minw),1fr));grid-auto-rows:calc(var(--minw)*.68);grid-auto-flow:dense;gap:var(--gap);padding:0 20px 20px}
.tile{position:relative;background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-radius:var(--rad);padding:1rem;display:flex;flex-direction:column;justify-content:space-between;border:2px solid transparent;overflow:hidden}
.tile.w2{grid-column:span 2}.tile.h2{grid-row:span 2}
.tile.on{border-color:var(--c,var(--on));background:color-mix(in srgb,var(--c,var(--on)) 22%,var(--card))}
.tile .ic{font-size:1.8rem;line-height:1}
.tile .nm{font-size:1rem}
.tile .tx{min-width:0}
.tile.val .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .st{color:var(--mut);font-size:.85rem}
.tile .sub{color:var(--mut);font-size:.8rem}
.tile.on .st{color:var(--c,var(--on))}
.tile.val .st{font-size:1.5rem;color:var(--tx)}
.tile.big .ic{font-size:2.8rem}.tile.big .nm{font-size:1.25rem}.tile.big .st{font-size:1rem}.tile.big.val .st{font-size:2.4rem}
.tile.cam{padding:0;justify-content:flex-end;background:#000}
.tile.cam>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.tile.cam .ic{display:none}
.tile.cam .tx{position:relative;z-index:1;padding:.5rem 1rem;background:linear-gradient(transparent,#000a)}
.tile.cam .st{color:#ddd}
#camov{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center}
#camov[hidden]{display:none}
#camov img{max-width:100%;max-height:100%;object-fit:contain}
#camx{position:absolute;top:14px;right:14px;background:#000a;color:#fff;border:0;border-radius:50%;width:3rem;height:3rem;font-size:1.4rem}
.stp{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.stc{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stp button{background:#0006;color:var(--tx);border:0;border-radius:50%;width:2.3rem;height:2.3rem;font-size:1.3rem;line-height:1}
.editing .tile{outline:2px dashed #fff8}
.ctl{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:2}
.ctl button{background:#000b;color:#fff;border:0;border-radius:8px;padding:6px 9px;font-size:1rem}
.ctl .hd{touch-action:none;cursor:grab}
.tile.drag{z-index:20;box-shadow:0 12px 32px #000a;opacity:.92;pointer-events:none}
dialog{background:#1b222c;color:var(--tx);border:0;border-radius:16px;padding:20px;width:min(560px,92vw);max-height:88vh;overflow:auto}
dialog::backdrop{background:#000a}
dialog button,.fbtn{background:#2c3746;color:var(--tx);border:0;border-radius:10px;padding:10px 14px;font-size:1rem;margin:4px 6px 4px 0}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:.85rem}
input[type=text],input[type=password],select{width:100%;padding:10px;border-radius:8px;border:1px solid #2c3746;background:#10141a;color:var(--tx);font-size:1rem}
input[type=range]{width:55%}
input[type=color]{width:56px;height:36px;border:0;background:none;padding:0}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2c3746}
.row input{width:22px;height:22px}
.f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;color:var(--tx);font-size:1rem}
.f span{color:var(--tx)}
.emo button{font-size:1.4rem;padding:6px 9px;margin:2px}
.badge{position:fixed;bottom:8px;right:12px;color:var(--mut);font-size:.8rem;text-shadow:0 1px 4px #000}
</style>
</head>
<body>
<div id="bgimg"></div><div id="dim"></div>
<header>
  <div id="clockbox"><div id="clock">--:--</div><div id="date"></div></div>
  <div class="btns"><button id="bEdit">Entitäten</button><button id="bDes">Design</button><button id="bAdj">Anpassen</button><button id="bSet">Einstellungen</button></div>
</header>
<div id="grid"></div>
<div class="badge" id="badge"></div>

<div id="camov" hidden><button id="camx">✕</button><img id="camimg" alt=""></div>

<dialog id="dEdit">
  <h3>Entitäten wählen</h3>
  <input type="text" id="eSearch" placeholder="Suchen…">
  <select id="eType" style="margin-top:8px"></select>
  <div id="list"></div>
  <p><button id="eClose">Fertig</button></p>
</dialog>

<dialog id="dSet">
  <h3>Einstellungen</h3>
  <div class="row"><input type="checkbox" id="sDemo"><span>Demo-Modus</span></div>
  <label>Home-Assistant-Adresse (z. B. wss://ha.example.de)</label>
  <input type="text" id="sUrl" placeholder="wss://...">
  <label>Long-Lived Access Token (bleibt nur auf diesem Gerät)</label>
  <input type="password" id="sTok">
  <p><button id="sClose">Speichern</button></p>
  <p style="color:var(--mut);font-size:.85rem">Adresse mit http://, https:// oder ws://, wss:// – egal, wird umgewandelt. Von einer https-Seite aus geht nur wss:// bzw. https://.</p>
</dialog>

<dialog id="dDes">
  <h3>Design</h3>
  <div class="f"><span>Hintergrundbild</span><span><button id="dImg">Bild wählen</button><button id="dImgX">Entfernen</button></span></div>
  <input type="file" id="dFile" accept="image/*" style="display:none">
  <div id="dsForm"></div>
  <p><button id="dReset">Zurücksetzen</button><button id="dClose">Fertig</button></p>
</dialog>

<dialog id="dTile">
  <h3 id="tTitle">Kachel</h3>
  <label>Name</label><input type="text" id="tName">
  <label>Symbol (Emoji)</label><input type="text" id="tIcon" placeholder="z. B. 💡">
  <div class="emo" id="tEmo"></div>
  <div class="f"><span>Farbe</span><span><input type="color" id="tColor"> <button id="tColorX">Standard</button></span></div>
  <label>Größe</label>
  <select id="tSize"><option value="1x1">Klein (1×1)</option><option value="2x1">Breit (2×1)</option><option value="1x2">Hoch (1×2)</option><option value="2x2">Groß (2×2)</option></select>
  <p><button id="tRemove">Kachel entfernen</button><button id="tClose">Fertig</button></p>
</dialog>

<script>
// ---------- Typen ----------
// k: tog = an/aus schalten, ro = nur Anzeige, act = auslösen, media = Play/Pause, clim = Heizung mit +/-
const T={
  light:{i:"💡",k:"tog",l:"Licht"}, switch:{i:"🔌",k:"tog",l:"Schalter"}, input_boolean:{i:"🔘",k:"tog",l:"Eingabeschalter"},
  fan:{i:"🌀",k:"tog",l:"Ventilator"}, automation:{i:"🤖",k:"tog",l:"Automation"}, cover:{i:"🪟",k:"tog",l:"Rolladen"},
  sensor:{i:"🌡️",k:"ro",l:"Sensor"}, binary_sensor:{i:"👁️",k:"ro",l:"Binärsensor"},
  scene:{i:"🎬",k:"act",l:"Szene"}, script:{i:"▶️",k:"act",l:"Skript"}, button:{i:"⏺️",k:"act",l:"Taster"},
  media_player:{i:"🎵",k:"media",l:"Medien"}, climate:{i:"♨️",k:"clim",l:"Heizung/Klima"}, camera:{i:"📷",k:"cam",l:"Kamera"}
};
const BS={door:["Offen","Zu"],window:["Offen","Zu"],opening:["Offen","Zu"],garage_door:["Offen","Zu"],motion:["Bewegung","Ruhig"],occupancy:["Belegt","Frei"],presence:["Anwesend","Abwesend"],smoke:["Alarm","OK"],gas:["Alarm","OK"],moisture:["Nass","Trocken"]};
const DEMO = {
  "light.wohnzimmer":{name:"Wohnzimmer",state:"on",type:"light"},
  "light.kueche":{name:"Küche",state:"off",type:"light"},
  "light.flur":{name:"Flur",state:"off",type:"light"},
  "switch.kaffeemaschine":{name:"Kaffeemaschine",state:"off",type:"switch"},
  "switch.steckdose_buero":{name:"Büro Steckdose",state:"on",type:"switch"},
  "cover.wohnzimmer_rolladen":{name:"Rolladen Wohnzimmer",state:"open",type:"cover"},
  "sensor.temp_wohnzimmer":{name:"Temperatur",state:"21.4 °C",type:"sensor"},
  "sensor.temp_aussen":{name:"Außen",state:"11.8 °C",type:"sensor"},
  "climate.wohnzimmer":{name:"Heizung Wohnzimmer",state:"heat",type:"climate",a:{cur:20.5,tgt:21,step:.5,min:5,max:30}},
  "scene.abend":{name:"Abendlicht",state:"scening",type:"scene"},
  "media_player.tv":{name:"Fernseher",state:"paused",type:"media_player",a:{title:"Tagesschau"}},
  "binary_sensor.fenster":{name:"Fenster Bad",state:"off",type:"binary_sensor",a:{dc:"window"}},
  "automation.nachtmodus":{name:"Nachtmodus",state:"on",type:"automation"}
};
const EMOJI=["💡","🔌","🪟","🌡️","🔥","❄️","🚪","🔒","📺","🎵","☕","🌿","🛋️","🛏️","🚿","🍳","🧺","🌙","☀️","🔔"];
const DS={bg:"#10141a",img:false,dim:.35,accent:"#f5b942",card:"#1b222c",op:.85,blur:0,minw:170,gap:14,rad:16,fs:1,clk:2.2,clock:true};
const FIELDS=[
  ["bg","Hintergrundfarbe","color"],["dim","Bild abdunkeln","range",0,.9,.05],
  ["accent","Akzentfarbe (an)","color"],["card","Kachelfarbe","color"],
  ["op","Kachel-Deckkraft","range",.15,1,.05],["blur","Glas-Weichzeichner","range",0,30,1],
  ["minw","Kachelbreite","range",120,320,5],["gap","Abstand","range",4,30,1],
  ["rad","Rundung","range",0,40,1],["fs","Schriftgröße","range",.8,1.6,.05],
  ["clk","Uhrgröße","range",1,6,.1],["clock","Uhr anzeigen","check"]
];
const SIZES=["1x1","2x1","1x2","2x2"];
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const fmt=n=>n==null||isNaN(n)?"–":String(Math.round(n*10)/10).replace(".",",");

// ---------- Zustand ----------
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const old=LS("wp_cfg")||{};
let cfg=Object.assign({demo:true,url:"",token:"",selDemo:null,selLive:null,tiles:{}},old);
cfg.style=Object.assign({},DS,old.style||{});
if(!cfg.selDemo) cfg.selDemo=old.sel||Object.keys(DEMO).slice(0,6);
let ents=clone(DEMO), conn="", editing=false, bgData=LS("wp_bg");
const sel=()=>cfg.demo?cfg.selDemo:(cfg.selLive||[]);
const setSel=a=>{if(cfg.demo)cfg.selDemo=a;else cfg.selLive=a};
const save=()=>SV("wp_cfg",cfg);
const tc=id=>Object.assign({size:(ents[id]&&ents[id].type==="camera")?"2x1":"1x1",label:"",icon:"",color:""},cfg.tiles[id]||{});
const setTc=(id,o)=>{cfg.tiles[id]=Object.assign(tc(id),o);save();};

// ---------- Design anwenden ----------
function hex2rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function applyStyle(){
  const s=cfg.style,r=document.documentElement.style;
  r.setProperty("--bg",s.bg);r.setProperty("--on",s.accent);
  r.setProperty("--card",hex2rgba(s.card,s.op));
  r.setProperty("--blur",s.blur+"px");r.setProperty("--minw",s.minw+"px");
  r.setProperty("--gap",s.gap+"px");r.setProperty("--rad",s.rad+"px");r.setProperty("--fs",s.fs);
  const hasImg=s.img&&bgData;
  r.setProperty("--dim",hasImg?s.dim:0);
  $("bgimg").style.backgroundImage=hasImg?`url(${bgData})`:"none";
  $("clock").style.fontSize=s.clk+"rem";
  $("clockbox").style.visibility=s.clock?"visible":"hidden";
}
function buildDesignForm(){
  const f=$("dsForm");f.innerHTML="";
  FIELDS.forEach(([k,label,type,min,max,step])=>{
    const row=document.createElement("div");row.className="f";
    const lab=document.createElement("span");lab.textContent=label;row.appendChild(lab);
    const inp=document.createElement("input");
    if(type==="check"){inp.type="checkbox";inp.checked=!!cfg.style[k];inp.style.width="24px";inp.style.height="24px";}
    else{inp.type=type;inp.value=cfg.style[k];if(type==="range"){inp.min=min;inp.max=max;inp.step=step;}}
    inp.oninput=()=>{
      cfg.style[k]=type==="check"?inp.checked:type==="range"?parseFloat(inp.value):inp.value;
      save();applyStyle();
    };
    row.appendChild(inp);f.appendChild(row);
  });
}
function pickImage(file){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,1920/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      const url=c.toDataURL("image/jpeg",.82);
      if(SV("wp_bg",url)){bgData=url;cfg.style.img=true;save();applyStyle();}
      else alert("Bild zu groß für den Speicher des Browsers. Bitte ein kleineres Bild nehmen.");
    };
    im.onerror=()=>alert("Das Bild konnte nicht gelesen werden.");
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
$("bDes").onclick=()=>{buildDesignForm();$("dDes").showModal()};
$("dClose").onclick=()=>$("dDes").close();
$("dImg").onclick=()=>$("dFile").click();
$("dFile").onchange=e=>{if(e.target.files[0])pickImage(e.target.files[0]);e.target.value="";};
$("dImgX").onclick=()=>{cfg.style.img=false;bgData=null;try{localStorage.removeItem("wp_bg")}catch(e){}save();applyStyle();};
$("dReset").onclick=()=>{if(confirm("Design auf Standard zurücksetzen? (Kacheln bleiben)")){cfg.style=clone(DS);save();applyStyle();buildDesignForm();}};

// ---------- Anzeige ----------
function isOn(e){
  const k=T[e.type].k;
  if(k==="tog") return e.state==="on"||e.state==="open";
  if(k==="media") return e.state==="playing";
  if(k==="clim") return e.state!=="off"&&e.state!=="unavailable";
  if(e.type==="binary_sensor") return e.state==="on";
  return false;
}
function stText(e){
  const a=e.a||{};
  switch(e.type){
    case "sensor": return e.state;
    case "cover": return e.state==="open"?"Offen":e.state==="closed"?"Zu":e.state;
    case "binary_sensor": {const m=BS[a.dc];return e.state==="on"?(m?m[0]:"An"):e.state==="off"?(m?m[1]:"Aus"):e.state;}
    case "climate": return fmt(a.cur)+" °C";
    case "media_player": return e.state==="playing"?(a.title||"Wiedergabe"):e.state==="paused"?"Pause":e.state==="off"||e.state==="idle"||e.state==="standby"?"Aus":e.state;
    case "scene": case "script": case "button": return "Tippen";
    case "camera": return "Tippen für Live";
    default: return e.state==="on"?"An":e.state==="off"?"Aus":e.state;
  }
}
function move(id,dir){
  const a=[...sel()],i=a.indexOf(id),j=i+dir;
  if(i<0||j<0||j>=a.length) return;
  [a[i],a[j]]=[a[j],a[i]];setSel(a);save();render();
}
function nextSize(id){
  const s=tc(id).size,n=SIZES[(SIZES.indexOf(s)+1)%SIZES.length];
  setTc(id,{size:n});render();
}
function render(){
  const g=$("grid");g.innerHTML="";
  g.className=editing?"editing":"";
  const ids=sel().filter(id=>ents[id]);
  ids.forEach(id=>{
    const e=ents[id],t=tc(id),[w,h]=t.size.split("x"),k=T[e.type].k,a=e.a||{};
    const d=document.createElement("div");
    d.dataset.id=id;
    d.className="tile"+(isOn(e)?" on":"")+(k==="ro"?" ro":"")+(k==="cam"?" cam":"")+(k==="ro"||k==="clim"?" val":"")
      +(w==="2"?" w2":"")+(h==="2"?" h2 big":"");
    if(t.color) d.style.setProperty("--c",t.color);
    d.innerHTML=`<div class="ic">${esc(t.icon||T[e.type].i)}</div><div class="tx"><div class="nm">${esc(t.label||e.name)}</div>${k==="clim"?`<div class="st stc"><span>${esc(stText(e))}</span><span class="sub">Soll ${esc(fmt(a.tgt))}°</span></div>`:`<div class="st">${esc(stText(e))}</div>`}</div>`;
    if(k==="cam") d.insertBefore(camEl(id),d.firstChild);
    if(editing){
      const c=document.createElement("div");c.className="ctl";
      [["◀",()=>move(id,-1)],["▶",()=>move(id,1)],["⤢",()=>nextSize(id)],["✎",()=>openTile(id)]].forEach(([l,fn])=>{
        const b=document.createElement("button");b.textContent=l;b.onclick=ev=>{ev.stopPropagation();fn();};c.appendChild(b);
      });
      const hd=document.createElement("button");hd.textContent="✥";hd.className="hd";hd.title="Ziehen";
      hd.onpointerdown=ev=>startDrag(ev,d,hd);c.appendChild(hd);
      d.appendChild(c);
    } else {
      if(k==="clim"){
        const s=document.createElement("div");s.className="stp";
        [["−",-1],["+",1]].forEach(([l,dir])=>{
          const b=document.createElement("button");b.textContent=l;b.onclick=ev=>{ev.stopPropagation();stepTemp(id,dir);};s.appendChild(b);
        });
        d.appendChild(s);
      }
      if(k!=="ro"&&k!=="clim") d.onclick=()=>{tap(id);if(k==="act"){d.classList.add("on");setTimeout(()=>d.classList.remove("on"),700);}};
    }
    g.appendChild(d);
  });
  if(!ids.length&&(cfg.demo||conn==="Verbunden")){
    g.innerHTML='<p style="color:var(--mut);padding:0 4px;grid-column:1/-1">Keine Kacheln gewählt. Tippe oben auf „Entitäten“.</p>';
  }
  $("badge").textContent=cfg.demo?"Demo-Modus":conn;
  $("bAdj").textContent=editing?"Fertig":"Anpassen";
}
function callSvc(domain,service,id,data){
  if(!ws||ws.readyState!==1) return;
  const m={type:"call_service",domain,service,target:{entity_id:id}};
  if(data) m.service_data=data;
  wsSend(m);
}
function tap(id){
  const e=ents[id],k=T[e.type].k;
  if(k==="cam"){openCam(id);return;}
  if(k==="ro"||k==="clim") return;
  if(cfg.demo){
    if(k==="tog") e.state=e.type==="cover"?(e.state==="open"?"closed":"open"):(e.state==="on"?"off":"on");
    else if(k==="media") e.state=e.state==="playing"?"paused":"playing";
    render();return;
  }
  if(k==="tog") callSvc(e.type,"toggle",id);
  else if(k==="media") callSvc("media_player","media_play_pause",id);
  else if(e.type==="scene") callSvc("scene","turn_on",id);
  else if(e.type==="script") callSvc("script","turn_on",id);
  else if(e.type==="button") callSvc("button","press",id);
}
function stepTemp(id,dir){
  const e=ents[id],a=e.a||(e.a={});
  const step=a.step||.5,base=a.tgt!=null?a.tgt:a.cur;
  if(base==null) return;
  let n=Math.round((base+dir*step)*10)/10;
  if(a.min!=null) n=Math.max(a.min,n);
  if(a.max!=null) n=Math.min(a.max,n);
  if(cfg.demo){a.tgt=n;render();}
  else callSvc("climate","set_temperature",id,{temperature:n});
}
$("bAdj").onclick=()=>{editing=!editing;render();};

// ---------- Kameras ----------
const camEls={};
function haBase(){const u=wsUrl();return u?u.replace(/^ws/i,"http").replace(/\/api\/websocket$/,""):"";}
function camUrl(id,stream){
  const e=ents[id];if(!e||!e.a||!e.a.pic) return "";
  let u=haBase()+e.a.pic;
  if(stream) return u.replace("/camera_proxy/","/camera_proxy_stream/");
  return u+(u.includes("?")?"&":"?")+"_t="+Date.now();
}
function camEl(id){
  let im=camEls[id];
  if(!im){im=camEls[id]=document.createElement("img");im.draggable=false;im.alt="";}
  const pic=(ents[id].a&&ents[id].a.pic)||"";
  if(im.dataset.pic!==pic){im.dataset.pic=pic;if(pic)im.src=camUrl(id);}
  return im;
}
function openCam(id){
  const u=camUrl(id,true);if(!u) return;

// ---------- Ziehen zum Umsortieren ----------
function startDrag(ev,el,handle){
  ev.preventDefault();ev.stopPropagation();
  const grid=$("grid"),r=el.getBoundingClientRect(),ox=ev.clientX-r.left,oy=ev.clientY-r.top;
  el.classList.add("drag");
  const follow=(x,y)=>{
    el.style.transform="none";
    const p=el.getBoundingClientRect();
    el.style.transform=`translate(${x-ox-p.left}px,${y-oy-p.top}px)`;
  };
  const onMove=e=>{
    el.style.transform="none";
    const p=el.getBoundingClientRect();
    const inside=e.clientX>=p.left&&e.clientX<=p.right&&e.clientY>=p.top&&e.clientY<=p.bottom;
    if(!inside){
      const t=document.elementFromPoint(e.clientX,e.clientY);
      const tile=t&&t.closest&&t.closest(".tile");
      if(tile&&tile!==el&&grid.contains(tile)){
        const kids=[...grid.children];
        if(kids.indexOf(el)<kids.indexOf(tile)) tile.after(el); else tile.before(el);
      }
    }
    follow(e.clientX,e.clientY);
  };
  const end=()=>{
    window.removeEventListener("pointermove",onMove);
    window.removeEventListener("pointerup",end);
    window.removeEventListener("pointercancel",end);
    const order=[...grid.children].map(c=>c.dataset.id).filter(Boolean);
    setSel([...order,...sel().filter(id=>!order.includes(id))]);
    save();render();
  };
  // Auf window statt am Griff: Beim Umsortieren wird das Element im DOM verschoben und verliert sonst den Zeiger.
  window.addEventListener("pointermove",onMove);
  window.addEventListener("pointerup",end);
  window.addEventListener("pointercancel",end);
}

// ---------- Home-Assistant-Verbindung ----------
let ws=null,msgId=1,statesId=0,retry=null,opened=false;
function wsUrl(){
  let u=cfg.url.trim();
  if(!u) return "";
  if(/^https?:/i.test(u)) u=u.replace(/^http/i,"ws");
  else if(!/^wss?:/i.test(u)) u=(location.protocol==="https:"?"wss://":"ws://")+u;
  return u.replace(/\/+$/,"").replace(/\/api\/websocket$/,"")+"/api/websocket";
}
function wsSend(o){const id=msgId++;ws.send(JSON.stringify(Object.assign({id},o)));return id;}
function disconnect(){
  clearTimeout(retry);
  if(ws){ws.onclose=null;ws.onmessage=null;ws.onerror=null;try{ws.close()}catch(e){}ws=null;}
}
function applyState(s){
  const id=s.entity_id,dom=id.split(".")[0];
  if(!T[dom]) return;
  const a=s.attributes||{};
  ents[id]={name:a.friendly_name||id,type:dom,
    state:dom==="sensor"?s.state+(a.unit_of_measurement?" "+a.unit_of_measurement:""):s.state,
    a:{dc:a.device_class,cur:a.current_temperature,tgt:a.temperature,step:a.target_temp_step,min:a.min_temp,max:a.max_temp,title:a.media_title,pic:a.entity_picture}};
}
function connect(){
  disconnect();
  if(cfg.demo){ents=clone(DEMO);conn="";render();return;}
  ents={};
  if(!cfg.url||!cfg.token){conn="Adresse oder Token fehlt";render();return;}
  conn="Verbinde …";render();
  opened=false;
  try{ws=new WebSocket(wsUrl());}
  catch(e){conn="Blockiert (vermutlich https-Seite → ws://). Adresse mit wss:// nötig.";render();return;}
  const me=ws;
  me.onmessage=ev=>{
    let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==="auth_required"){me.send(JSON.stringify({type:"auth",access_token:cfg.token}));}
    else if(m.type==="auth_ok"){
      opened=true;conn="Verbunden";
      statesId=wsSend({type:"get_states"});
      wsSend({type:"subscribe_events",event_type:"state_changed"});
      render();
    }
    else if(m.type==="auth_invalid"){
      disconnect();conn="Token ungültig";render();
    }
    else if(m.type==="result"){
      if(m.id===statesId&&m.success){ents={};m.result.forEach(applyState);render();}
      else if(!m.success){conn="Fehler: "+((m.error&&m.error.message)||"unbekannt");render();}
    }
    else if(m.type==="event"&&m.event&&m.event.event_type==="state_changed"){
      const d=m.event.data;
      if(d.new_state) applyState(d.new_state); else delete ents[d.entity_id];
      if(!editing) render();
    }
  };
  me.onclose=()=>{
    conn=opened?"Getrennt, neuer Versuch …":"Keine Verbindung (Adresse, Port, WLAN prüfen; bei https-Seite wss:// nötig)";
    render();
    clearTimeout(retry);retry=setTimeout(connect,5000);
  };
}
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&!cfg.demo&&(!ws||ws.readyState>1)) connect();
});

// ---------- Entitätenwahl ----------
function renderList(){
  const q=$("eSearch").value.trim().toLowerCase(),ty=$("eType").value;
  const l=$("list");l.innerHTML="";
  let ids=Object.keys(ents).sort((a,b)=>a.localeCompare(b));
  if(ty) ids=ids.filter(id=>ents[id].type===ty);
  if(q) ids=ids.filter(id=>(ents[id].name+" "+id).toLowerCase().includes(q));
  if(!ids.length){l.innerHTML='<p style="color:var(--mut)">'+(cfg.demo||conn==="Verbunden"?"Nichts gefunden.":"Noch nicht mit Home Assistant verbunden.")+'</p>';return;}
  ids.slice(0,150).forEach(id=>{
    const r=document.createElement("label");r.className="row";r.style.color="var(--tx)";r.style.margin=0;
    r.innerHTML=`<input type="checkbox" ${sel().includes(id)?"checked":""}><span>${esc(ents[id].name)} <small style="color:var(--mut)">${esc(id)}</small></span>`;
    r.querySelector("input").onchange=ev=>{
      setSel(ev.target.checked?[...sel(),id]:sel().filter(x=>x!==id));
      save();render();
    };
    l.appendChild(r);
  });
  if(ids.length>150){const p=document.createElement("p");p.style.color="var(--mut)";p.textContent="… "+(ids.length-150)+" weitere, bitte per Suche eingrenzen.";l.appendChild(p);}
}
function buildTypeFilter(){
  const present=[...new Set(Object.values(ents).map(e=>e.type))].sort();
  const s=$("eType");s.innerHTML='<option value="">Alle Typen</option>'+present.map(t=>`<option value="${t}">${T[t].i} ${T[t].l}</option>`).join("");
}
$("eSearch").oninput=renderList;
$("eType").onchange=renderList;
$("bEdit").onclick=()=>{$("eSearch").value="";buildTypeFilter();renderList();$("dEdit").showModal()};
$("eClose").onclick=()=>$("dEdit").close();

// ---------- Einstellungen ----------
$("bSet").onclick=()=>{$("sDemo").checked=cfg.demo;$("sUrl").value=cfg.url;$("sTok").value=cfg.token;$("dSet").showModal()};
$("sClose").onclick=()=>{
  cfg.demo=$("sDemo").checked;cfg.url=$("sUrl").value.trim();cfg.token=$("sTok").value.trim();
  save();$("dSet").close();connect();
};

// ---------- Uhr ----------
function tick(){
  const n=new Date();
  $("clock").textContent=n.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  $("date").textContent=n.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
}
applyStyle();tick();setInterval(tick,10000);connect();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
